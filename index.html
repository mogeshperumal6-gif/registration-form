<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>

<!-- Tailwind CSS (loaded from CDN, no build step needed) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Our own separate CSS file for any extra/custom styles -->
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white shadow-md rounded-lg p-8 w-full max-w-sm">

    <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Registration Form</h2>

    <form id="regForm">

      <!-- Name Field -->
      <div class="mb-4">
        <label for="name" class="block text-gray-700 font-medium mb-1">Name</label>
        <input type="text" id="name" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <p id="nameError" class="text-red-500 text-sm mt-1 hidden">Name cannot be empty</p>
      </div>

      <!-- Email Field -->
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-1">Email</label>
        <input type="text" id="email" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <p id="emailError" class="text-red-500 text-sm mt-1 hidden">Please enter a valid email address</p>
      </div>

      <!-- Password Field -->
      <div class="mb-6">
        <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <p id="passwordError" class="text-red-500 text-sm mt-1 hidden">Password must be at least 6 characters</p>
      </div>

      <!-- Submit Button (disabled until form is valid) -->
      <button type="submit" id="submitBtn" disabled class="submit-btn w-full text-white font-semibold py-2 rounded">
        Submit
      </button>

      <p id="successMsg" class="text-green-600 text-center mt-4 hidden">Registration successful!</p>

    </form>
  </div>

  <!-- Our own separate JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
